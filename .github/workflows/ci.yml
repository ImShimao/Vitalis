name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurer
        run: dotnet restore Vitalis.sln

      - name: Compiler (Release, x64)
        run: dotnet build Vitalis.sln -c Release --no-restore

      - name: Tester
        run: dotnet test Vitalis.sln -c Release --no-build --filter "Categorie!=Reel" --logger "trx;LogFileName=resultats.trx"

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: "**/TestResults/*.trx"
